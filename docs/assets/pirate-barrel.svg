  <title id="pirate-title">Le tonneau du capitaine</title>
  <desc id="pirate-desc">Un tonneau de rhum en bois, équipé d’un petit écran et coiffé d’un tricorne à tête de mort. Deux sabres et une rose des vents complètent cette gravure pirate.</desc>
