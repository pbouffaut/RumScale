; RumScale — tonneau de vieillissement connecté
;
; Trois cibles, une seule base de code. Choisis la tienne avec -e :
;
;   pio run -e ideaspark -t upload     ESP32-WROOM-32 + écran couleur ST7789 1,9"
;   pio run -e esp32dev  -t upload     ESP32-WROOM-32 + OLED SSD1306 I²C
;   pio run -e esp32s3   -t upload     ESP32-S3 nu    + OLED SSD1306 I²C
;
; Le HTML de l'app est embarqué dans le firmware (src/web_ui.h) : il n'y a PAS de
; `uploadfs` à faire. LittleFS ne sert qu'à l'historique et se formate seul.
;
; Le firmware pèse ~1,5 Mo (TLS pour Telegram + serveur asynchrone), il ne tient
; donc pas dans les 1,31 Mo du schéma de partitions par défaut. huge_app donne
; 3 Mo à l'application et 896 Ko au système de fichiers. On perd l'OTA, dont on
; n'a pas l'usage : le flashage se fait en USB.

[common]
platform  = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
lib_deps =
	bogde/HX711@^0.7.5
	olikraus/U8g2@^2.35.30
	bblanchon/ArduinoJson@^7.2.0
	tzapu/WiFiManager@^2.0.17
	ESP32Async/AsyncTCP@^3.3.2
	ESP32Async/ESPAsyncWebServer@^3.7.0
	https://github.com/ricmoo/QRCode.git
; Arduino_GFX est volontairement figé en 1.4.x : depuis la 1.5, son pilote SPI
; ESP32 inclut esp32-hal-periman.h, qui n'existe que dans le core Arduino 3.x,
; sans garde de version. La plateforme espressif32 6.x officielle fournit le
; core 2.0.17. Ne remonte cette borne qu'en passant aussi au core 3.x.
	moononournation/GFX Library for Arduino@~1.4.0

; --- ideaspark ESP32 + ST7789 1,9" 170x320 (cible principale) ----------------
; L'écran est câblé en dur sur la carte : MOSI 23, SCK 18, CS 15, DC 2, RST 4,
; rétroéclairage 32. HX711 A actif : DOUT 25, SCK 26 ; B optionnel : 16/17.
; NUM_CHANNELS vaut 1 dans config.h (quatre demi-cellules en un pont complet).
; U8g2 reste dans les dépendances : Arduino_GFX sait afficher ses polices.

[env:ideaspark]
extends = common
board = esp32dev
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DASYNCWEBSERVER_REGEX
	-DBOARD_TFT_ST7789

; --- ESP32-WROOM-32 + OLED SSD1306 ------------------------------------------

[env:esp32dev]
extends = common
board = esp32dev
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DASYNCWEBSERVER_REGEX
	-DBOARD_OLED

; --- ESP32-S3 nu + OLED SSD1306 ---------------------------------------------
; Pour un Waveshare ESP32-S3-DEV-KIT ou un Freenove ESP32-S3-WROOM.
; `qio_opi` correspond à la PSRAM octale des modules « R8 ». Si ta carte n'a pas
; de PSRAM ou l'a en quad, enlève cette ligne, sinon elle ne démarrera pas.

[env:esp32s3]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DASYNCWEBSERVER_REGEX
	-DBOARD_S3
	-DBOARD_OLED
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
